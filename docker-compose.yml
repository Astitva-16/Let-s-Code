
name: lets-code

services:
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: lets-code-api-gateway
    ports:
      - "8003:8003"
    env_file:
      - ./backend/api-gateway/.env
    environment:
      CODE_RUNNER_SERVICE_URL: http://code-runner-service:8002
      FEATURE_SERVICE_URL: http://feature-service:8000
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    depends_on:
      - feature-service
      - code-runner-service
    networks:
      - lets-code-net

  code-runner-service:
    build:
      context: ./backend/code-runner-service
      dockerfile: Dockerfile
    container_name: lets-code-code-runner
    ports:
      - "8002:8002"
    env_file:
      - ./backend/code-runner-service/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BASE_URL: http://feature-service:8000
      STATE: development
    volumes:
      - ./backend/code-runner-service:/app
      - /app/node_modules
    depends_on:
      - redis
      - feature-service
    networks:
      - lets-code-net

  feature-service:
    build:
      context: ./backend/feature-service
      dockerfile: Dockerfile
    container_name: lets-code-feature
    ports:
      - "8000:8000"
    env_file:
      - ./backend/feature-service/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: "mongodb://mongo:27017/Lets%20Code"
      ORIGIN: http://localhost:5173
      STATE: development
    volumes:
      - ./backend/feature-service:/app
      - /app/node_modules
    depends_on:
      - redis
      - mongo
    networks:
      - lets-code-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lets-code-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_FEATURE_SERVICE_URL: http://localhost:8000
      VITE_API_GATEWAY_URL: http://localhost:8003
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - lets-code-net

  redis:
    image: redis:7
    container_name: lets-code-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - lets-code-net

  mongo:
    image: mongo:7
    container_name: lets-code-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - lets-code-net

volumes:
  redis-data:
  mongo-data:

networks:
  lets-code-net:
    driver: bridge
